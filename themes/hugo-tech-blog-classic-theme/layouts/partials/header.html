<header class="site-header">
  <nav class="container primary-nav" aria-label="Primary navigation">
    <a class="brand" href="{{ site.Home.RelPermalink }}">{{ site.Title }}</a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="mobile-menu">Menu</button>
    {{ with site.Menus.main }}<div class="desktop-nav">{{ $currentPage := $ }}{{ range . }}<a href="{{ .URL }}"{{ if $currentPage.IsMenuCurrent .Menu . }} class="active" aria-current="page"{{ end }}>{{ .Name }}</a>{{ end }}</div>{{ end }}
  </nav>
  {{ with site.Menus.main }}<nav id="mobile-menu" class="mobile-nav container" aria-label="Mobile navigation">{{ $currentPage := $ }}{{ range . }}<a href="{{ .URL }}"{{ if $currentPage.IsMenuCurrent .Menu . }} class="active" aria-current="page"{{ end }}>{{ .Name }}</a>{{ end }}</nav>{{ end }}
</header>
