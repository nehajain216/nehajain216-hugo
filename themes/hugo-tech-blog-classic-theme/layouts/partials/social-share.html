{{ $url := .Permalink | urlquery | safeURL }}
{{ $title := .Title | urlquery | safeURL }}
<nav class="social-share" aria-label="Share this post">
  <span><i class="fa-solid fa-share-nodes" aria-hidden="true"></i> Share</span>
  <a href="https://twitter.com/intent/tweet?url={{ $url }}&text={{ $title }}" target="_blank" rel="noopener noreferrer" aria-label="Share on X" title="Share on X"><i class="fa-brands fa-x-twitter" aria-hidden="true"></i><span class="sr-only">X</span></a>
  <a href="https://www.linkedin.com/sharing/share-offsite/?url={{ $url }}" target="_blank" rel="noopener noreferrer" aria-label="Share on LinkedIn" title="Share on LinkedIn"><i class="fa-brands fa-linkedin-in" aria-hidden="true"></i><span class="sr-only">LinkedIn</span></a>
  <a href="mailto:?subject={{ $title }}&body={{ $url }}" aria-label="Share by email" title="Share by email"><i class="fa-solid fa-envelope" aria-hidden="true"></i><span class="sr-only">Email</span></a>
</nav>
